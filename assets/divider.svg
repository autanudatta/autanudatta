<svg width="100%" height="24" viewBox="0 0 1200 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B132B" stop-opacity="0" />
      <stop offset="50%" stop-color="#1E3A8A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>
  </defs>

  
  <line x1="80" y1="12" x2="1120" y2="12" stroke="url(#trackGrad)" stroke-width="1.5" />

  
  <rect x="80" y="10.5" width="220" height="3" rx="1.5" fill="url(#pulseGrad)">
    <animate attributeName="x" from="80" to="900" dur="3.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="3.5s" repeatCount="indefinite" />
  </rect>

  
  <polygon points="600,5 607,12 600,19 593,12" fill="#0B132B" stroke="#38BDF8" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
  </polygon>
</svg>
